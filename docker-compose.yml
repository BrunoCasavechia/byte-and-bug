# Sobe a loja inteira: banco (db), API (api) e site (web).
# O ambiente vem do arquivo .env escolhido:
#   docker compose --env-file .env.qa up -d --build
#   docker compose --env-file .env.dev up -d --build
name: byte-and-bug-${APP_ENV:-dev}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bytebug
      POSTGRES_PASSWORD: bytebug
      POSTGRES_DB: bytebug
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytebug"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PORT: 3333
      DATABASE_URL: postgres://bytebug:bytebug@db:5432/bytebug
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-86400}
      ENABLE_QA_ROUTES: ${ENABLE_QA_ROUTES:-false}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${API_PORT:-3333}:3333"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:${API_PORT:-3333}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  db-data:
  uploads:
