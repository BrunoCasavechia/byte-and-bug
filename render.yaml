# Render Blueprint: sobe a loja inteira na nuvem (site, API e banco) a partir deste repositório.
# A cada push na branch main, o Render publica a versão nova sozinho.
services:
  - type: web
    name: byte-and-bug-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: qa
      - key: ENABLE_QA_ROUTES
        value: "true"
      # 15 min, como numa loja real. O refresh token mantém a sessão por 7 dias.
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_SECONDS
        value: "604800"
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: byte-and-bug-db
          property: connectionString
      # Endereço público do site (o "host" do Render é o nome interno, não serve para o navegador).
      - key: CORS_ORIGIN
        value: https://byte-and-bug-web.onrender.com

  - type: web
    name: byte-and-bug-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://byte-and-bug-api.onrender.com

databases:
  - name: byte-and-bug-db
    plan: free
    databaseName: bytebug
    user: bytebug
